name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests (core/fees/levels/security)
        run: pnpm exec vitest run packages/core packages/levels packages/security --passWithNoTests

      - name: Typecheck core packages (best-effort)
        run: |
          pnpm --filter @cryptra/core typecheck || true
          pnpm --filter @cryptra/config typecheck || true
          pnpm --filter @cryptra/fees typecheck || true
        continue-on-error: true
