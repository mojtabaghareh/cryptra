# HTTPS edge for cryptraa.ir → 5.75.205.142
#
#   export EMAIL=your@email.com
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d --build

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-cryptraa.ir}
      EMAIL: ${EMAIL:-admin@cryptraa.ir}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - miniapp
      - api

  miniapp:
    ports: !reset []

  api:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
